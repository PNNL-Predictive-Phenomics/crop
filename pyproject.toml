# See https://setuptools.readthedocs.io/en/latest/build_meta.html
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crop"
version = "0.0.1-dev"
description = "Consistent Reproduction of Phenotype"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jeremy Zucker", email = "jeremy.zucker@pnnl.gov"},
]
maintainers = [
    {name = "Jeremy Zucker", email = "jeremy.zucker@pnnl.gov"},
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Pytest",
    "Framework :: tox",
    "Framework :: Sphinx",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
]
keywords = ["snekpack", "cookiecutter"]
dependencies = [
    "more_itertools",
    "tqdm",
    "click",
    "more_click",
    "cvxpy",
    "cobra",
    "pandas",
    "pyarrow",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/pnnl-predictive-phenomics/crop"
Download = "https://github.com/pnnl-predictive-phenomics/crop/releases"
Tracker = "https://github.com/pnnl-predictive-phenomics/crop/issues"
Source = "https://github.com/pnnl-predictive-phenomics/crop"
Documentation = "https://crop.readthedocs.io"

[project.optional-dependencies]
tests = [
    "pytest",
    "coverage",
    "pytest-cov",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-click",
    "sphinx-autodoc-typehints",
    "sphinx_automodapi",
]

[project.scripts]
crop = "crop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
reverse_relative = true

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = [
    ".tox",
    "build",
    "dist",
    "docs/build",
    "docs/notebook",
    "htmlcov",
    "coverage_results",
    ".jupyter",
    "tests/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E203", # whitespace before ':'
    "E501", # let formatter handle long lines pragmatically
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "F811", # legacy duplicate fixture names in historical tests
    "W293", # whitespace-only line noise in legacy tests
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
